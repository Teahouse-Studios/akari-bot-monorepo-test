# monorepo 根：虚拟工作区，不发布自身。依赖按包归位于各成员的 pyproject.toml，
# 本文件只声明成员、workspace 内的版本来源，以及整个仓库的工具配置。

# packages/* 会匹配到 adapters/ 与 modules/ 两个容器目录（它们不是包），故按前缀收窄范围。
[tool.uv.workspace]
members = ["packages/akari-bot-*", "packages/adapters/*", "packages/modules/*"]

[tool.uv.sources]
# 资源包不在索引上：成员对它的依赖须显式指向工作区成员，uv 才会认这条依赖。
akari-bot-assets-brand = { workspace = true }
akari-bot-assets-emotes = { workspace = true }
akari-bot-assets-fonts = { workspace = true }
akari-bot-core = { workspace = true }
akari-bot-html2text = { workspace = true }

[dependency-groups]
dev = [
    "coverage>=7.9.1,<8.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
# 单元测试走 pytest。包内测试与集成用例仍由 tester.py 运行。
testpaths = ["tests/unit"]
markers = ["akari_timeout: 覆盖单个测试的超时秒数"]
filterwarnings = ["ignore:cannot collect test class:pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 120
# 根 pyproject 无 [project]，target-version 无法由 requires-python 推出，须显式声明。
target-version = "py312"

[tool.ruff.lint]
ignore = ["E402", "F405", "F403", "E741", "E721"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
reportUndefinedVariable = "error"
