# monorepo 根：虚拟工作区，不发布自身。依赖按包归位于各成员的 pyproject.toml，
# 本文件只声明成员、workspace 内的版本来源，以及全仓工具配置。

# packages/* 会匹配到 adapters/ 与 modules/ 两个容器目录（它们不是包），故按前缀收窄。
[tool.uv.workspace]
members = ["packages/akari-bot-*", "packages/adapters/*", "packages/modules/*"]

[tool.uv.sources]
akari-bot-core = { workspace = true }
akari-bot-html2text = { workspace = true }

[dependency-groups]
dev = [
    "coverage>=7.9.1,<8.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
# packages 下只有各包自带的 tests/ 含 test_*.py，收集器按文件名筛选，故整树纳入即可。
testpaths = ["tests", "packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:cannot collect test class:pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 120
# 根 pyproject 无 [project]，target-version 无法由 requires-python 推出，须显式声明。
target-version = "py312"

[tool.ruff.lint]
ignore = ["E402", "F405", "F403", "E741", "E721"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
reportUndefinedVariable = "error"
