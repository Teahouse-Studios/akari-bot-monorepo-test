repos:
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.10.2
      hooks:
          - id: uv-export
            args: ["--no-hashes", "--output-file=requirements.txt"]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.0
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: local
      hooks:
          # 只检查暂存区新增与修改的行，规则见 generated_docs/monorepo_refactor_prep.md §8。
          - id: comment-lint
            name: Lint comments
            entry: uv run python tools/lint_comments.py --diff HEAD
            language: system
            files: '\.py$'
            pass_filenames: false

