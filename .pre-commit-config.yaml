repos:
    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.10.2
      hooks:
          - id: uv-export
            args: ["--no-hashes", "--output-file=requirements.txt"]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.0
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: local
      hooks:
          # 只检查暂存区新增与修改的行，规则见 generated_docs/monorepo_refactor_prep.md §8。
          - id: comment-lint
            name: Lint comments
            entry: uv run python tools/lint_comments.py --diff HEAD
            language: system
            files: '\.py$'
            pass_filenames: false

          # 分层检查：模块不得 import 平台适配器，core 不得 import 模块或适配器。
          # 与 comment-lint 同理只查改动行，避免既有 B1 命中阻塞提交。
          - id: boundary-lint
            name: Lint import boundaries
            entry: uv run python tools/lint_boundaries.py --diff HEAD
            language: system
            files: '\.py$'
            pass_filenames: false

