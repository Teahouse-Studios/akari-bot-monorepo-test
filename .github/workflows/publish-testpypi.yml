name: TestPyPI rehearsal

# 首发候选演练：一次构建全部 workspace 分发，串行上传 TestPyPI，再从 TestPyPI 下载真实文件
# 并在 Linux/Windows/macOS 上做净室安装验证。只写 TestPyPI，不碰 PyPI、gh-pages 与 Release。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: dry-run 只构建与生成发行清单；publish 才上传 TestPyPI
        type: choice
        options: [dry-run, publish]
        default: dry-run
        required: true
      auth:
        description: 上传凭据方式；fork 演练用 token，官方仓库正式演练用 Trusted Publishing
        type: choice
        options: [token, trusted-publishing]
        default: token
        required: true
      batch_id:
        description: 批次标识，写入发行清单；留空按 run 编号生成
        required: false
      version_override:
        description: 重复演练填 0.1.0.postN（改全部 57 个 pyproject 版本）；首次演练留空
        required: false
      max_new_projects:
        description: 本次最多创建的新项目数；TestPyPI 按窗口配额（实测约 20），默认 18
        required: false
        default: "18"

permissions:
  contents: read

concurrency:
  group: testpypi-rehearsal
  cancel-in-progress: false

env:
  TESTPYPI_INDEX: https://test.pypi.org
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dists: ${{ steps.release.outputs.dists }}
      batch_id: ${{ steps.release.outputs.batch_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Apply batch version override
        if: inputs.version_override != ''
        run: python tools/set_batch_version.py "${{ inputs.version_override }}"

      - name: Build all workspace distributions
        run: |
          rm -rf dist
          uv build --all-packages --out-dir dist
          test "$(ls dist | wc -l)" -ge 114

      - name: Record batch manifest
        id: release
        env:
          BATCH_INPUT: ${{ inputs.batch_id }}
        run: |
          BATCH_ID="${BATCH_INPUT:-run-$GITHUB_RUN_NUMBER}"
          uv run --no-project --with packaging python tools/publish_registry.py batch-manifest \
            --dist-dir dist --output release-batch.json \
            --git-sha "$GITHUB_SHA" --batch-id "$BATCH_ID"
          echo "batch_id=$BATCH_ID" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          dists = sorted(json.loads(Path("release-batch.json").read_text())["dists"])
          print(f"dists={json.dumps(dists)}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-batch
          path: release-batch.json
          if-no-files-found: error
          retention-days: 30

  publish:
    # 单 job 串行上传：Token 模式下按依赖顺序逐个 twine 上传，避免 57 个 matrix job 逐个触发
    # environment 审批；Trusted Publishing 走下面的独立 matrix job（OIDC 需要 action 逐次签发）。
    needs: build
    if: inputs.confirm == 'publish' && inputs.auth == 'token'
    runs-on: ubuntu-latest
    environment: testpypi
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-batch
          path: .

      - name: Install release tools
        # 发布脚本由 runner 的 python 直接执行，需把 packaging 与 twine 装进同一环境。
        run: python -m pip install --disable-pip-version-check packaging twine

      - name: Publish in dependency order
        env:
          TESTPYPI_TOKEN: ${{ secrets.TESTPYPI_TOKEN }}
          MAX_NEW_PROJECTS: ${{ inputs.max_new_projects }}
        run: |
          python tools/testpypi_publish.py \
            --manifest release-batch.json --dist-dir dist \
            --index-url "$TESTPYPI_INDEX" --repository-url https://test.pypi.org/legacy/ \
            --token "$TESTPYPI_TOKEN" --delay 3 --max-new-projects "$MAX_NEW_PROJECTS" \
            --summary publish-summary.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          summary = json.loads(Path("publish-summary.json").read_text())
          print("### TestPyPI 上传结果")
          print(f"- 上传 {len(summary['uploaded'])} 个分发")
          print(f"- 已存在跳过 {len(summary['skipped'])} 个")
          print(f"- 待续 {len(summary['remaining'])} 个：{'、'.join(summary['remaining'][:8]) or '无'}")
          if summary.get("rate_limited_after"):
              print(f"- 被限速，建议 {summary['rate_limited_after']}s 后重跑")
          print()
          print("未传完时用同一批清单再触发一次即可续传（只补缺失文件）。")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-summary
          path: publish-summary.json
          if-no-files-found: ignore
          retention-days: 30

  publish-trusted:
    # 官方仓库正式演练用：为 57 个项目配 pending publisher 后，由 action 逐次签发 OIDC 令牌。
    needs: build
    if: inputs.confirm == 'publish' && inputs.auth == 'trusted-publishing'
    runs-on: ubuntu-latest
    environment: testpypi
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dist: ${{ fromJSON(needs.build.outputs.dists) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-batch
          path: .
      - name: Stage this distribution
        id: stage
        env:
          RELEASE_DIST: ${{ matrix.dist }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          dist = os.environ["RELEASE_DIST"]
          entry = json.loads(Path("release-batch.json").read_text())["dists"][dist]
          staged = Path("one-dist")
          staged.mkdir(exist_ok=True)
          for name in entry["files"]:
              shutil.copy2(Path("dist") / name, staged / name)
          Path("one-expected.json").write_text(json.dumps({"dist": dist, **entry}), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={entry['version']}\n")
          PY
          uv run --no-project --with packaging python tools/publish_registry.py prepare-upload \
            --dist "$RELEASE_DIST" --version "${{ steps.stage.outputs.version }}" \
            --dist-dir one-dist --manifest one-expected.json \
            --index-url "$TESTPYPI_INDEX" --output upload-dist
          echo "count=$(python -c 'from pathlib import Path; print(len(list(Path("upload-dist").iterdir())))')" >> "$GITHUB_OUTPUT"
      - name: Publish to TestPyPI (Trusted Publishing)
        if: steps.stage.outputs.count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload-dist/

  verify-local-index:
    # 不经过任何外部仓库：把本批产物建成 PEP 503 静态索引，按索引地址装全量，验证解析/元数据/entry points。
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/

      - name: Build static index and install all distributions
        shell: bash
        run: |
          # 服务由构建进程自己起，服务根就是刚生成的索引目录，不依赖相对路径的解释。
          uv run --no-project --with packaging python tools/build_local_index.py \
            --dist-dir dist --output local-index --serve 8123 &
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8123/simple/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "静态索引服务未就绪：cwd=$(pwd)"
            ls -la local-index 2>&1 | head -5
            exit 1
          fi
          # 自证一次产物下载：索引可达而文件取不到时，后续安装只会给出难以定位的 404。
          probe=$(grep -m1 -ho 'files/[^"#]*\.whl' local-index/simple/*/index.html | head -1 | cut -d/ -f2-)
          if [ -z "$probe" ] || ! curl -fsS --max-time 30 -o /dev/null "http://127.0.0.1:8123/files/$probe"; then
            echo "索引自证失败：files/$probe"
            ls -la local-index 2>&1 | head -5
            ls local-index/files 2>&1 | head -5
            exit 1
          fi
          echo "索引自证通过：files/$probe"
          uv run --no-project --with packaging python tools/clean_room_check.py \
            --local-index-url http://127.0.0.1:8123 --combo index-all
          uv run --no-project --with packaging python tools/clean_room_check.py \
            --local-index-url http://127.0.0.1:8123 --combo index

  verify:
    needs: [build, publish, publish-trusted]
    if: always() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish-trusted.result == 'success')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        combo: [core, core-full, typical, all, cli, index]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-batch
          path: .

      - name: Trim manifest to what TestPyPI already has
        id: present
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, time, urllib.error, urllib.request
          from pathlib import Path

          batch = json.loads(Path("release-batch.json").read_text())
          expected = len(batch["dists"])


          def probe() -> dict:
              found = {}
              for name, entry in batch["dists"].items():
                  try:
                      urllib.request.urlopen(f"https://test.pypi.org/pypi/{name}/json", timeout=30).read()
                      found[name] = entry
                  except urllib.error.HTTPError:
                      pass
              return found


          # 同一次运行刚建的项目在索引 JSON 上有 CDN 延迟，等它追平再定「哪些还没传」。
          deadline = time.time() + 300
          present = probe()
          while len(present) < expected and time.time() < deadline:
              time.sleep(20)
              present = probe()
          Path("release-batch-present.json").write_text(
              json.dumps({**batch, "dists": present}, ensure_ascii=False), encoding="utf-8"
          )
          print(f"present={len(present)}")
          print(f"complete={'true' if len(present) == len(batch['dists']) else 'false'}")
          PY

      - name: Install from TestPyPI and probe
        env:
          COMBO: ${{ matrix.combo }}
          COMPLETE: ${{ steps.present.outputs.complete }}
        shell: bash
        run: |
          # 部分上传阶段只跑不依赖缺失分发的组合；全量就绪后跑完整矩阵。
          if [ "$COMPLETE" = "true" ]; then
            SELECTED="$COMBO"
          else
            case "$COMBO" in
              core|core-full) SELECTED="$COMBO" ;;
              *) echo "TestPyPI 尚未传完（${{ steps.present.outputs.present }} 个），跳过 $COMBO"; exit 0 ;;
            esac
          fi
          uv run --no-project --with packaging python tools/clean_room_check.py \
            --index-url "$TESTPYPI_INDEX" --manifest release-batch-present.json \
            --download-dir indexed-files --combo "$SELECTED"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ matrix.os }}-${{ matrix.combo }}
          path: indexed-files/
          if-no-files-found: ignore
          retention-days: 14
