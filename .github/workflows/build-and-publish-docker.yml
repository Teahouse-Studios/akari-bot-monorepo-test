name: Build and Publish Docker (3:00, UTC+8)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.tag.outputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine image tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-\.]?(a|b|rc|alpha|beta|pre|preview|dev)[-\.]?[0-9]+)?$ ]]; then
              echo "无效的产品版本 tag。" >&2
              exit 1
            fi
            IMAGE_TAG="${GITHUB_REF_NAME}"
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              CHANNEL="stable"
            else
              CHANNEL="prerelease"
            fi
          else
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "master" ]]; then
              echo "手动 nightly 构建必须选 master；候选发行必须选版本 tag。" >&2
              exit 1
            fi
            IMAGE_TAG="nightly-$(date +'%Y%m%d')"
            CHANNEL="nightly"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Write version file
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          echo "$IMAGE_TAG" > assets/.version
          cat assets/.version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE_NAME: dorowolf/akari-bot
          TAG: ${{ steps.tag.outputs.image_tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        shell: bash
        run: |
          docker buildx create --use

          TAG_ARGS=(-t "$IMAGE_NAME:$TAG")

          # 稳定版只推不可变版本名，避免旧 tag 重跑或并发完成顺序回退 latest。
          if [[ "$CHANNEL" == "nightly" ]]; then
            TAG_ARGS+=(-t "$IMAGE_NAME:nightly")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$TAG" \
            "${TAG_ARGS[@]}" \
            --push .

  promote-stable:
    needs: build-and-push
    if: needs.build-and-push.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-stable-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve highest available stable image
        run: |
          git fetch origin --tags
          uv run --no-project --with packaging python tools/promote_docker.py \
            --image dorowolf/akari-bot --output promotion.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          promotion = json.loads(Path("promotion.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f'PROMOTION_SOURCE={promotion["image"]}@{promotion["digest"]}\n')
          PY

      - name: Promote exact stable digest
        run: |
          docker buildx imagetools create --prefer-index=false --tag dorowolf/akari-bot:latest "$PROMOTION_SOURCE"
          uv run --no-project --with packaging python tools/promote_docker.py \
            --image dorowolf/akari-bot --output promotion.json --verify-latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-stable-promotion
          path: promotion.json
          if-no-files-found: ignore
          retention-days: 90
