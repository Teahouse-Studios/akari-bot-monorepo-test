name: CLI binary (Nuitka)

# T6.5(a)：只冻结 CLI（参数解析、TUI、子进程调度、HTTP 与 TOML 读写）。机器人本体不进二进制——
# CLI 经子进程调用实例 venv 里的 `python -m akaribot.core.entrypoints.run`，因此 multiprocessing、
# Tortoise ORM、七个平台 SDK、各模块及其依赖全部退出冻结范围，这是新构建远比旧的整仓编译可靠的原因。
permissions:
  contents: read

on:
  schedule:
    - cron: "00 19 * * *"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install CLI dependencies
        shell: bash
        run: |
          # 只装 CLI 自己的依赖面：不拉 core、模块与平台 SDK，冻结范围因此收敛。
          uv sync --locked --package akari-bot-cli

      - name: Bundle uv binary
        shell: bash
        run: |
          # 内置 uv：CLI 靠它创建与维护实例 venv，用户机器上不必预装。
          cp "$(command -v uv)" ./uv-bundled

      - name: Build CLI binary
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: packages/akari-bot-cli/akaribot/cli/main.py
          mode: onefile
          output-dir: cli-build
          # 包内资源漏掉会让 TUI 在用户机器上崩（textual 的 .tcss、rich 的内置主题）。手工列举必然
          # 会漏，唯一可靠的兜底是在**不含 Python 的环境**里跑冒烟——本仓库尚无该环境，属已知缺口。
          include-data-files: |
            uv-bundled=uv
          include-package-data: |
            textual
            rich
          include-package: |
            textual
            rich
            typer
            click
            tomlkit
            httpx
            packaging

      - name: Smoke test binary
        shell: bash
        run: |
          # 冻结后 sys.executable 指向二进制自身，故此处只验证 CLI 自身可用与包内资源可加载。
          BIN=$(find cli-build -maxdepth 1 -type f \( -name "*.bin" -o -name "*.exe" -o -perm -u+x \) | head -n 1)
          echo "产物：$BIN"
          "$BIN" --version
          "$BIN" tui --self-check

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: akaribot-cli-${{ matrix.os }}
          path: cli-build/
          if-no-files-found: warn
