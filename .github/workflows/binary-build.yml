name: CLI binary (Nuitka)

# T6.5(a) 仅打包 CLI（参数解析、TUI、子进程调度、HTTP 与 TOML 读写），机器人本体不打包到二进制文件中。
# 运行时由 CLI 通过子进程调用实例 venv 里的 `python -m akaribot.core.entrypoints.run`，因此 multiprocessing、
# Tortoise ORM、各平台 SDK 与各模块依赖均无需打包，打包范围仅限 CLI 自身依赖，构建也更稳定。
permissions:
  contents: read

on:
  schedule:
    - cron: "00 19 * * *"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install CLI dependencies
        shell: bash
        run: |
          # 仅安装 CLI 自身的依赖，不引入 core、模块与平台 SDK，从而将打包范围限定在 CLI 自身。
          uv sync --locked --package akari-bot-cli

      - name: Select workspace interpreter
        shell: bash
        run: |
          # Nuitka 在后续步骤中会使用 PATH 中的 python。不切换到工作区 venv 时它无法获取依赖，
          # 会提示 "failed to locate package 'akaribot.cli'"。
          root="$(pwd -W 2>/dev/null || pwd)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            venv_dir="$root/.venv/Scripts"
            python_exe="$venv_dir/python.exe"
          else
            venv_dir="$root/.venv/bin"
            python_exe="$venv_dir/python"
          fi
          echo "$venv_dir" >> "$GITHUB_PATH"
          # uv 创建的 venv 不带 pip，而后续步骤会用 `pip install` 安装 Nuitka。此处需要先向 venv 补充安装
          # pip，否则命令会调用 PATH 更靠后的系统 pip 将 Nuitka 安装到系统解释器中，导致 `python -m nuitka` 无法找到模块。
          uv pip install --python "$python_exe" pip
          "$python_exe" -c "import akaribot.cli, akari_bot_i18n, textual, rich, typer, tomlkit, httpx, packaging"
          echo "解释器：$("$python_exe" -c 'import sys; print(sys.executable)')"

      - name: Bundle uv binary
        shell: bash
        run: |
          # 内置 uv，供 CLI 创建与维护实例 venv，用户环境中无需预先安装。复制时直接使用包内最终文件名，
          # 无需使用 include-data-files 的重命名表达式（Windows 的可执行后缀必须是 .exe）。
          mkdir -p bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$(command -v uv)" bundle/uv.exe
          else
            cp "$(command -v uv)" bundle/uv
            chmod +x bundle/uv
          fi
          ls -l bundle

      - name: Build CLI binary
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: packages/akari-bot-cli/akaribot/cli/main.py
          mode: onefile
          output-dir: cli-build
          # 缺少包内资源会让 TUI 在用户机器上崩溃（textual 的 .tcss、rich 的内置主题）。手动列举必然
          # 会遗漏，唯一可靠的方案是在不包含 Python 的环境中运行基本检查。本仓库尚无该环境，属于已知限制。
          include-data-dir: |
            bundle=.
            packages/akari-bot-cli/akaribot/cli/locales=akaribot/cli/locales
            packages/akari-bot-cli/akaribot/cli/templates=akaribot/cli/templates
            packages/akari-bot-cli/akaribot/cli/docs=akaribot/cli/docs
            packages/akari-bot-cli/akaribot/cli/docs_engine/template=akaribot/cli/docs_engine/template
            packages/akari-bot-cli/akaribot/cli/docs_engine/home=akaribot/cli/docs_engine/home
            packages/akari-bot-cli/akaribot/cli/docs_engine/footer=akaribot/cli/docs_engine/footer
            packages/akari-bot-cli/akaribot/cli/docs_engine/snippets=akaribot/cli/docs_engine/snippets
            packages/akari-bot-cli/akaribot/cli/docs_engine/assets=akaribot/cli/docs_engine/assets
          include-data-files: |
            packages/akari-bot-cli/akaribot/cli/docs_engine/defaults.toml=akaribot/cli/docs_engine/defaults.toml
          # CLI 包自身的资源已在上方按目录明确声明，此处重复声明仅会触发 "Duplicate data file" 告警。
          # i18n 包的 locales 与其他第三方包的数据文件由 package-data 收集。
          include-package-data: |
            akari_bot_i18n
            textual
            rich
          include-package: |
            akaribot.cli
            akari_bot_i18n
            textual
            rich
            typer
            tomlkit
            httpx
            packaging

      - name: Smoke test binary
        shell: bash
        run: |
          # 打包后 sys.executable 指向二进制文件自身，因此此处仅验证 CLI 自身是否可用以及包内资源能否正常加载。
          BIN=$(find cli-build -maxdepth 1 -type f \( -name "*.bin" -o -name "*.exe" -o -perm -u+x \) | head -n 1)
          echo "产物：$BIN"
          "$BIN" --version
          "$BIN" tui --self-check
          "$BIN" new module release_probe --non-interactive --no-add --dir "$RUNNER_TEMP/cli-smoke"
          "$BIN" new adapter release_probe --non-interactive --no-add --dir "$RUNNER_TEMP/cli-smoke"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: akaribot-cli-${{ matrix.os }}
          path: cli-build/
          if-no-files-found: warn
