name: Builtin Tester

permissions:
  checks: write
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

# 全量用例一轮约 36 分钟，只读包目录那一轮还要再跑一次。两轮都拆分为多个分片并行执行，实际耗时降至
# 单个分片的时长。某个分片失败时其余分片继续运行，失败清单因此始终完整。
jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          # --locked 会重新求解，是检查 workspace 依赖冲突的唯一位置。不得设置为 --frozen。
          uv sync --locked --all-extras --dev

      - name: Lint comments
        shell: bash
        run: |
          # PR 仅检查相对目标分支的新增与修改行，推送与手动触发则检查全部文件。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/lint_comments.py --diff "$BASE"
          else
            uv run python tools/lint_comments.py
          fi

      - name: Lint import boundaries
        shell: bash
        run: |
          # 分层检查沿用与注释检查相同的范围判定，PR 对比目标分支，推送对比变更前提交。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/lint_boundaries.py --diff "$BASE"
          else
            uv run python tools/lint_boundaries.py
          fi

      - name: Lint internal version constraints
        shell: bash
        run: |
          # workspace 覆盖会丢弃内部依赖的版本约束，而发布的 wheel 仍保留该约束，
          # uv lock 无法发现，因此单独列出一项检查（参见 T4.8）。
          uv run python tools/lint_versions.py

      - name: Report version bumps
        # 版本号属于发布元数据而非行为正确性，tester 的结论应仅取决于代码与测试。
        # 违规项仍会输出供发布前确认，但不会阻断本 job（重复版本由 PyPI 在发布时拒绝）。
        continue-on-error: true
        shell: bash
        run: |
          # 包内有源码改动但未更新 version 时会发出提示。提交信息最后一段包含独立的 Skip-Version
          # trailer 时按声明范围豁免（true 为全部成员，逗号分隔时仅豁免列出的成员）。
          # 正文里附带提到该标记不视为声明，避免解释功能的一句话意外关闭整个提交范围的检查。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/check_versions.py --base "$BASE"
          else
            echo "无可用 base，跳过版本守卫。"
          fi

      - name: Lint with Ruff
        shell: bash
        run: |
          # 静态检查覆盖整个仓库，格式化则仅检查本次改动的文件。历史文件是否已格式化与本轮改动无关，
          # 不应阻断无关提交（否则任何人的推送都会因他人的旧文件而检查失败）。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          uv run ruff check .
          FILES=()
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            while IFS= read -r path; do
              FILES+=("$path")
            done < <(git diff --name-only --diff-filter=ACMR "${BASE}...HEAD" -- '*.py')
          else
            echo "无可用 base，改为检查全部 Python 文件。"
            while IFS= read -r path; do
              FILES+=("$path")
            done < <(git ls-files -- '*.py')
          fi
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "本次改动不含 Python 文件，跳过格式化检查。"
          else
            uv run ruff format --check "${FILES[@]}"
          fi

      - name: Run unit tests
        timeout-minutes: 30
        env:
          CI: "1"
          PYTHONIOENCODING: "UTF-8"
          AKARI_TEST_TIME_SCALE: "10"
        run: |
          uv run python -m pytest tests/unit -q --junitxml=junit-unit.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: junit-unit.xml
          if-no-files-found: warn

  test:
    name: Integration tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 某个分片失败时其余分片继续运行至完成，失败清单才完整。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --locked --all-extras --dev

      - name: Run integration tests
        timeout-minutes: 25
        env:
          CI: "1"
          AKARI_TEST_TIME_SCALE: "10"
          # 每个入口打印一行准备阶段耗时，便于定位耗时偏高的准备阶段。
          AKARI_TEST_SETUP_TIMING: "1"
        run: |
          # 分片按文件在收集顺序中的序号取模，新增用例文件自动落入某个分片，不需要维护分片清单。
          FILES=()
          while IFS= read -r path; do
            FILES+=("$path")
          done < <(python3 .github/scripts/test_shard.py \
            --shard ${{ matrix.shard }} --total ${{ strategy.job-total }})
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "本分片没有选中任何测试文件。" >&2
            exit 1
          fi
          # runner 发现任何失败就以非 0 退出，其中包含基线中记录的既有失败。因此本步骤仅记录退出码，
          # 最终判定由 report job 按名称对比失败清单得出。
          set +e
          uv run python tester.py "${FILES[@]}"
          echo "tester_exit=$?" >> "$GITHUB_ENV"
          set -e
          cp junit.xml "junit-normal-${{ matrix.shard }}.xml"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-normal-${{ matrix.shard }}
          path: junit-normal-${{ matrix.shard }}.xml
          if-no-files-found: warn

  readonly:
    name: Read-only tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --locked --all-extras --dev

      - name: Run tests with read-only package directories
        timeout-minutes: 25
        env:
          CI: "1"
          AKARI_TEST_TIME_SCALE: "10"
        run: |
          # 包目录在只读挂载与 wheel 安装下均不可写，此处通过只读权限模拟该约束。
          # 仅覆盖测试触及的代码路径。未被测试覆盖的下载路径需要通过人工复核确认，
          # 参见 generated_docs/monorepo_refactor_prep.md 的 P2 记录。
          # 检查以整个 packages/ 目录作为扫描根目录。若将 core 与 modules 的路径以固定常量写入，包再次拆分或重命名时
          # 就会遗漏检查而不报错。使用单一根目录不受包增减影响，代价是适配器目录也会一并设为只读。
          chmod -R a-w packages
          FILES=()
          while IFS= read -r path; do
            FILES+=("$path")
          done < <(python3 .github/scripts/test_shard.py \
            --shard ${{ matrix.shard }} --total ${{ strategy.job-total }})
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "本分片没有选中任何测试文件。" >&2
            exit 1
          fi
          set +e
          uv run python tester.py "${FILES[@]}"
          echo "readonly_tester_exit=$?" >> "$GITHUB_ENV"
          set -e
          cp junit.xml "junit-readonly-${{ matrix.shard }}.xml"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-readonly-${{ matrix.shard }}
          path: junit-readonly-${{ matrix.shard }}.xml
          if-no-files-found: warn

  report:
    name: Report
    # 任一分片失败也要汇总，否则失败清单不完整，判定也就失去意义。
    if: always()
    needs: [lint, test, readonly]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true

      - name: Check failure set against baseline
        shell: bash
        run: |
          # 各分片分别产出一份 junit，合并后与唯一的一份基准对比，基准因此不随分片数变化。
          python3 tools/check_test_baseline.py \
            --junit reports/junit-normal-*.xml --baseline tools/test_baseline.txt

      - name: Check read-only failure set against baseline
        shell: bash
        run: |
          # 只读挂载下可能出现与写入磁盘相关的额外失败，因此单独维护一份基准清单。两轮测试均按名称对比
          # 失败清单，且两份清单均仅允许减少。
          python3 tools/check_test_baseline.py \
            --junit reports/junit-readonly-*.xml --baseline tools/test_baseline_readonly.txt

      - name: Generate test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test report
          path: reports/junit*.xml
          reporter: java-junit
          fail-on-error: 'false'
