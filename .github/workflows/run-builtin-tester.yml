name: Builtin Tester

permissions:
  checks: write
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --locked --all-extras --dev

      - name: Lint comments
        shell: bash
        run: |
          # PR 只检查相对 base 的新增与修改行，push 与手动触发检查全部文件。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/lint_comments.py --diff "$BASE"
          else
            uv run python tools/lint_comments.py
          fi

      - name: Lint with Ruff
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Copy config files
        shell: bash
        run: |
          mkdir -p config
          cp -r assets/config_store/zh_cn/* config/

      - name: Run tests
        timeout-minutes: 60
        env:
          CI: "1"
          AKARI_TEST_TIME_SCALE: "10"
        run: |
          uv run python tester.py

      - name: Generate test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test report
          path: junit.xml
          reporter: java-junit
          fail-on-error: 'false'
