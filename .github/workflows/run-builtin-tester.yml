name: Builtin Tester

permissions:
  checks: write
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          # --locked 会重新求解，是 workspace 依赖互斥的唯一拦截点；不得改为 --frozen
          # 或 pip install，否则 PR 阶段将静默失去冲突探测能力（见 T4.9、CONTRIBUTING.md）。
          uv sync --locked --all-extras --dev

      - name: Lint comments
        shell: bash
        run: |
          # PR 只检查相对 base 的新增与修改行，push 与手动触发检查全部文件。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/lint_comments.py --diff "$BASE"
          else
            uv run python tools/lint_comments.py
          fi

      - name: Lint import boundaries
        shell: bash
        run: |
          # 分层检查沿用与注释检查相同的范围判定：PR 比对 base，push 比对 before。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/lint_boundaries.py --diff "$BASE"
          else
            uv run python tools/lint_boundaries.py
          fi

      - name: Lint internal version constraints
        shell: bash
        run: |
          # workspace 覆盖会丢弃内部依赖的版本约束，而发布出的 wheel 仍带着它，
          # uv lock 发现不了，故单列一道检查（见 T4.8）。
          uv run python tools/lint_versions.py

      - name: Check version bumps
        shell: bash
        run: |
          # T6.2 版本守卫：包内有源码改动但 version 未变即失败，提交信息含 [skip-version] 时放行。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/check_versions.py --base "$BASE"
          else
            echo "无可用 base，跳过版本守卫。"
          fi

      - name: Lint with Ruff
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        timeout-minutes: 60
        env:
          CI: "1"
          AKARI_TEST_TIME_SCALE: "10"
        run: |
          uv run python tester.py

      - name: Run tests with read-only package directories
        timeout-minutes: 60
        env:
          CI: "1"
          AKARI_TEST_TIME_SCALE: "10"
        run: |
          # 包目录在只读挂载与 wheel 安装下都不可写，此处以权限位复现该约束。
          # 只覆盖测试触及的代码路径；未被测试执行的下载路径另由人工复核守住，
          # 见 generated_docs/monorepo_refactor_prep.md 的 P2 记录。
          # 门禁以 packages/ 整树为扫描根：旧写法逐个硬编码 core modules，包一旦再次拆分或
          # 改名即静默失去覆盖；单根不随包增减变化，代价是适配器目录也一并纳入只读。
          chmod -R a-w packages
          trap 'chmod -R u+w packages' EXIT
          uv run python tester.py

      - name: Generate test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test report
          path: junit.xml
          reporter: java-junit
          fail-on-error: 'false'
