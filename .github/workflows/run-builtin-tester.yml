name: Builtin Tester

permissions:
  checks: write
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          # --locked 会重新求解，是 workspace 依赖互斥的唯一拦截点；不得改为 --frozen
          # 或 pip install，否则 PR 阶段将静默失去冲突探测能力（见 T4.9、CONTRIBUTING.md）。
          uv sync --locked --all-extras --dev

      - name: Lint comments
        shell: bash
        run: |
          # PR 只检查相对 base 的新增与修改行，push 与手动触发检查全部文件。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/lint_comments.py --diff "$BASE"
          else
            uv run python tools/lint_comments.py
          fi

      - name: Lint import boundaries
        shell: bash
        run: |
          # 分层检查沿用与注释检查相同的范围判定：PR 比对 base，push 比对 before。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/lint_boundaries.py --diff "$BASE"
          else
            uv run python tools/lint_boundaries.py
          fi

      - name: Lint internal version constraints
        shell: bash
        run: |
          # workspace 覆盖会丢弃内部依赖的版本约束，而发布出的 wheel 仍带着它，
          # uv lock 发现不了，故单列一道检查（见 T4.8）。
          uv run python tools/lint_versions.py

      - name: Check version bumps
        shell: bash
        run: |
          # T6.2 版本守卫：包内有源码改动但 version 未变即失败；提交信息最后一段写了独立的
          # Skip-Version trailer 时按声明范围豁免（true 为全部成员，逗号分隔的分发名只豁免列出的）。
          # 正文里顺带提到该 token 不算，避免解释功能的一句话关掉整段区间的检查。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/check_versions.py --base "$BASE"
          else
            echo "无可用 base，跳过版本守卫。"
          fi

      - name: Lint with Ruff
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run unit tests
        timeout-minutes: 30
        env:
          CI: "1"
          PYTHONIOENCODING: "UTF-8"
          AKARI_TEST_TIME_SCALE: "10"
        run: |
          uv run python -m pytest tests/unit -q --junitxml=junit-unit.xml

      - name: Run integration tests
        timeout-minutes: 60
        env:
          CI: "1"
          AKARI_TEST_TIME_SCALE: "10"
        run: |
          # runner 只要发现任何失败就以非 0 退出，而本仓库在拆分前就有 4 个用例失败（见
          # tools/test_baseline.txt）。若让退出码直接决定 step 成败，这一轮会立刻变红，后面的
          # 「只读包目录」一轮根本不会执行——那正是它长期没有被跑过的原因。故此处只记录退出码，
          # 由下一步的逐名对拍做权威判定；不用 `|| true`，也不比数量。
          set +e
          uv run python tester.py
          echo "tester_exit=$?" >> "$GITHUB_ENV"
          set -e
          cp junit.xml junit-normal.xml

      - name: Check failure set against baseline
        shell: bash
        run: |
          uv run python tools/check_test_baseline.py --junit junit-normal.xml --baseline tools/test_baseline.txt

      - name: Run tests with read-only package directories
        timeout-minutes: 60
        env:
          CI: "1"
          AKARI_TEST_TIME_SCALE: "10"
        run: |
          # 包目录在只读挂载与 wheel 安装下都不可写，此处以权限位复现该约束。
          # 只覆盖测试触及的代码路径；未被测试执行的下载路径另由人工复核守住，
          # 见 generated_docs/monorepo_refactor_prep.md 的 P2 记录。
          # 门禁以 packages/ 整树为扫描根：旧写法逐个硬编码 core modules，包一旦再次拆分或
          # 改名即静默失去覆盖；单根不随包增减变化，代价是适配器目录也一并纳入只读。
          chmod -R a-w packages
          trap 'chmod -R u+w packages' EXIT
          set +e
          uv run python tester.py
          echo "readonly_tester_exit=$?" >> "$GITHUB_ENV"
          set -e
          cp junit.xml junit-readonly.xml

      - name: Check read-only failure set against baseline
        shell: bash
        run: |
          # 只读挂载下可能多出写盘类失败，故单独一份基线：两轮都必须逐名对拍，且都能被强制缩小。
          uv run python tools/check_test_baseline.py \
            --junit junit-readonly.xml --baseline tools/test_baseline_readonly.txt

      - name: Generate test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test report
          path: junit*.xml
          reporter: java-junit
          fail-on-error: 'false'

  docs:
    # 文档站在 tester 通过后构建全部包的文档并发布到 GitHub Pages。只在默认分支的 push 与手动触发
    # 时发布：PR 与其它分支的产物不是发布物，也不该拿到 Pages 权限。
    # 仓库 Settings → Pages 的 Source 须为 GitHub Actions；enablement 会在尚未启用时自动打开。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 主题是 submodule：构建要复制它的 theme_dir，并按它的 docs-theme.json 决定依赖与 VitePress 版本。
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 主题清单要求 Node >= 22.12，引擎据此选 VitePress 2 与其依赖。
          node-version: "22"
          cache: npm
          cache-dependency-path: vendor/akari-bot-docs-template/package-lock.json

      - name: Install dependencies
        shell: bash
        run: uv sync --locked --all-extras --dev

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build documentation site
        shell: bash
        env:
          # 项目站点的基路径由此决定，构建期写入侧栏与资源地址，构建后再改要重跑。
          AKARIBOT_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
          # 非托管实例用系统解释器跑 core 入口；锁到工作区 venv，避免 runner 上另有 python3 抢先。
          AKARIBOT_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          # 引擎以「实例」为单位工作：这里只需要一个最小的实例根，产物落在它的 cache/docs/site。
          mkdir -p .ci-docs
          printf 'schema = 1\n' > .ci-docs/akaribot.toml
          uv run akaribot docs build -I .ci-docs --force
          test -f .ci-docs/cache/docs/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .ci-docs/cache/docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
