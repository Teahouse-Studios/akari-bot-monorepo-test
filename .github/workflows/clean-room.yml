name: Clean room install check

# T6.6 使用正式发布的 wheel 包验证用户的实际安装体验。workspace 的开发阶段覆盖会忽略内部版本约束，
# 仅在从 wheel 安装时才会真正通过依赖解析器，因此发布前必须执行这项检查。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/clean_room_check.py"
      - ".github/workflows/clean-room.yml"
  push:
    branches:
      - master
    paths:
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        shell: bash
        run: |
          uv sync --locked --all-extras --dev

      - name: Report changed packages
        shell: bash
        run: |
          # T6.1 输出本次改动对应的包名矩阵。core 或全局文件改动时标记 full。
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            uv run python tools/changed_packages.py --base "$BASE"
          else
            uv run python tools/changed_packages.py
          fi

      - name: Clean room install check
        shell: bash
        run: |
          uv run python tools/clean_room_check.py
