name: Publish Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set TAG_NAME
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]] || \
             [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-\.]?(a|b|rc|alpha|beta|pre|preview|dev)[-\.]?[0-9]+)?$ ]]; then
            echo "发布必须从有效的产品版本 tag 触发。" >&2
            exit 1
          fi
          echo "TAG_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Write version file
        run: |
          echo "$TAG_NAME" > assets/.version
          cat assets/.version

      - name: Package code
        run: |
          ZIP_NAME="AkariBot-$TAG_NAME.zip"
          zip -r "$ZIP_NAME" . -x '*.git*' 'tests/*' 'tests/**'
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AkariBot
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，保留发布记录与附件。"
            exit 0
          fi
          RELEASE_ARGS=(--verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            "${RELEASE_ARGS[@]}" \
            "$ZIP_NAME"
