[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-html2text"
version = "0.1.0"
description = "AkariBot 维护的 html2text 分支：HTML 转 Markdown 文本"
requires-python = ">=3.12,<4.0"
# 本包是 GPL-3.0 的上游分支，与本仓库主体的 AGPL-3.0 不同，分发时须原样携带 LICENCE。
license = "GPL-3.0"
license-files = ["LICENCE"]
# 只依赖标准库：包内 import 仅 html.entities/html.parser/re/urllib.parse/collections.abc/textwrap/argparse/sys。
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/html2text"]
