[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-adapter-milky"
version = "0.1.0"
description = "Milky 平台适配器"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "milky-python-sdk>=0.4.2",
    "tenacity>=9.0.0,<10.0.0",
]

[project.entry-points."akaribot.adapters"]
milky = "akaribot.adapters.milky"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
