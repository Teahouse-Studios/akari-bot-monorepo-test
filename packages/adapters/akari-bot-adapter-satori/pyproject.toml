[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-adapter-satori"
version = "0.1.0"
readme = "README.md"
description = "Satori 平台适配器"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "attrs>=26.1.0",
    "satori-python-client>=1.3.11",
]

[project.entry-points."akaribot.adapters"]
satori = "akaribot.adapters.satori"

[project.entry-points."akaribot.docs"]
adapter-satori = "akaribot.adapters.satori"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
