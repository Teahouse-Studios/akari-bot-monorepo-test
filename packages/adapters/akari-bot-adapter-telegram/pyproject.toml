[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-adapter-telegram"
version = "0.1.0"
description = "Telegram 平台适配器"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "aiogram==3.31.0",
    "attrs>=25.0.0,<26.0.0",
]

[project.entry-points."akaribot.adapters"]
telegram = "akaribot.adapters.telegram"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
