[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-adapter-qqbot"
version = "0.1.0"
readme = "README.md"
description = "QQ 平台适配器"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    # s3 extra 依据 plan:498 / tasks:1382；core/utils/s3.py 改为惰性 import 之前该 extra 不可用（T4.2 §6）
    "akari-bot-core[s3]>=0.1.0,<1.0",
    "attrs>=26.1.0",
    "qq-botpy-sdk==2.1.1",
    "httpx>=0.28.1,<1.0.0",
]

[project.entry-points."akaribot.adapters"]
qqbot = "akaribot.adapters.qqbot"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
