[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-adapter-kook"
version = "0.1.0"
readme = "README.md"
description = "Kook 平台适配器"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "httpx>=0.28.1,<1.0.0",
    "khl-py>=0.3.16,<1.0.0",
    "orjson>=3.10.9,<4.0.0",
]

[project.entry-points."akaribot.adapters"]
kook = "akaribot.adapters.kook"

[project.entry-points."akaribot.docs"]
adapter-kook = "akaribot.adapters.kook"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
