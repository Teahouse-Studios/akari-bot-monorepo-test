[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-adapter-onebot"
version = "0.1.0"
readme = "README.md"
description = "OneBot 平台适配器"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "aiocqhttp>=1.4.3,<2.0.0",
    "emoji>=2.12.1,<3.0.0",
    "orjson>=3.10.9,<4.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "Hypercorn>=0.18.0",
]

[project.entry-points."akaribot.adapters"]
onebot = "akaribot.adapters.onebot"

[project.entry-points."akaribot.docs"]
adapter-onebot = "akaribot.adapters.onebot"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
