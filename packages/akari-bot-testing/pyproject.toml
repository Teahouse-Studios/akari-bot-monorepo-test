[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-testing"
version = "0.1.0"
readme = "README.md"
description = "AkariBot 自研测试框架与运行器"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "defusedxml>=0.7.1",
    "loguru>=0.7.0,<1.0.0",
    "pytest>=9.0.2",
    "tortoise-orm>=1.1.2,<1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
