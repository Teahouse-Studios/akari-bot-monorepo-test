[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-testing"
version = "0.1.0"
description = "AkariBot 自研测试框架与运行器"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "defusedxml>=0.7.1",
    "loguru>=0.7.0,<1.0.0",
    "pytest>=9.0.2",
    "tortoise-orm>=1.1.2,<1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
