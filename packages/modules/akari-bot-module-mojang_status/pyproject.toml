[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-mojang_status"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Don_Trueno" },
]
description = "检查 Mojang 和 Minecraft 后端各服务的实时在线情况"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
]

[project.entry-points."akaribot.modules"]
mojang_status = "akaribot.modules.mojang_status"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
