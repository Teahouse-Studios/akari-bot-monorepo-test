[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-wiki"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "OasisAkari" },
    { name = "Dianliang233" },
]
description = "查询一个 Wiki 页面。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "akari-bot-html2text>=0.1.0,<1.0",
    "Pillow>=13.0.0,<13.1.0",
    # aiocqhttp 是模块→平台 SDK 的现存违规边（T4.2 §7.6），收敛到 core HTTP 层之前必须保留
    "aiocqhttp>=1.4.3,<2.0.0",
    "akari-bot-webrender==0.7.4",
    "attrs>=26.1.0",
    "beautifulsoup4>=4.11.1,<5.0.0",
    "feedparser>=6.0.10,<7.0.0",
    "filetype>=1.2.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "orjson>=3.10.9,<4.0.0",
    "tortoise-orm>=1.1.2,<1.2.0",
    "wikitextparser>=1.0.3",
]

[project.entry-points."akaribot.modules"]
wiki = "akaribot.modules.wiki"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
