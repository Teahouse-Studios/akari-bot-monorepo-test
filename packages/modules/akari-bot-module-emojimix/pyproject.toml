[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-emojimix"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "DoroWolf" },
]
description = "将两个 Emoji 合成为一张图片，留空则随机组合。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "emoji>=2.12.1,<3.0.0",
    "orjson>=3.10.9,<4.0.0",
]

[project.entry-points."akaribot.modules"]
emojimix = "akaribot.modules.emojimix"

[project.entry-points."akaribot.docs"]
module-emojimix = "akaribot.modules.emojimix"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
