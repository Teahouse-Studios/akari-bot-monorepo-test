[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-random"
version = "0.1.0"
authors = [
    { name = "Dianliang233" },
]
description = "随机数生成器。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
]

[project.entry-points."akaribot.modules"]
random = "akaribot.modules.random"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
