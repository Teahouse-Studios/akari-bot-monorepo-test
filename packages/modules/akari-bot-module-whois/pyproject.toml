[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-whois"
version = "0.1.0"
description = "查询 WHOIS 信息。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "python-whois>=0.9.0,<1.0.0",
]

[project.entry-points."akaribot.modules"]
whois = "akaribot.modules.whois"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
