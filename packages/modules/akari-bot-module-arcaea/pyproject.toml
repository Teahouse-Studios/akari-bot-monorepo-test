[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-arcaea"
version = "0.1.0"
description = "查询 Arcaea 相关内容。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "orjson>=3.10.9,<4.0.0",
]

[project.entry-points."akaribot.modules"]
arcaea = "akaribot.modules.arcaea"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
