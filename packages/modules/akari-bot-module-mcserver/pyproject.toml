[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-mcserver"
version = "0.1.0"
description = "获取 Minecraft 服务器 MOTD"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "mcstatus>=14.1.0,<14.2.0",
    "orjson>=3.10.9,<4.0.0",
]

[project.entry-points."akaribot.modules"]
mcserver = "akaribot.modules.mcserver"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
