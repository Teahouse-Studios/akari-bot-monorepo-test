[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-cytoid"
version = "0.1.0"
description = "查询 Cytoid 相关内容。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "akari-bot-html2text>=0.1.0,<1.0",
    "Pillow>=12.0.0,<13.0.0",
    "gql>=4.0.0,<5.0.0",
    "orjson>=3.10.9,<4.0.0",
    "tortoise-orm>=1.1.2,<1.2.0",
]

[project.entry-points."akaribot.modules"]
cytoid = "akaribot.modules.cytoid"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
