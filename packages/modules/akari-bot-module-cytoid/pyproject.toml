[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-cytoid"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "OasisAkari" },
]
description = "查询 Cytoid 相关内容。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    # rating 曲绘的文字用资源包里的 Noto Sans CJK DemiLight（T3.3），缺它则曲绘渲染失败。
    "akari-bot-assets-fonts>=0.1.0,<1.0",
    "akari-bot-core>=0.1.0,<1.0",
    "akari-bot-html2text>=0.1.0,<1.0",
    "Pillow>=13.0.0,<13.1.0",
    "gql>=4.0.0,<5.0.0",
    "orjson>=3.10.9,<4.0.0",
    "tortoise-orm>=1.1.2,<1.2.0",
]

[project.entry-points."akaribot.modules"]
cytoid = "akaribot.modules.cytoid"

[project.entry-points."akaribot.docs"]
module-cytoid = "akaribot.modules.cytoid"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
