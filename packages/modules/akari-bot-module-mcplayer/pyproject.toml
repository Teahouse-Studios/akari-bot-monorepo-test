[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-mcplayer"
version = "0.1.0"
description = "从 Mojang API 获取 Minecraft：Java 版的玩家信息。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=12.0.0,<13.0.0",
    "orjson>=3.10.9,<4.0.0",
]

[project.entry-points."akaribot.modules"]
mcplayer = "akaribot.modules.mcplayer"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
