# akari-bot-module-wolframalpha 的包清单。
schema = 1
requires_core_api = ">=1,<2"
locales = "locales"
# config.py 的 on_module_config("wolframalpha") 声明的表。
config_table = "module_wolframalpha"
config_schema_version = 1
provides_modules = ["wolframalpha"]
# 用于检查重复的登录信息字段，对应 WolframAlpha 应用 ID。
credential_fields = ["wolfram_alpha_appid"]
