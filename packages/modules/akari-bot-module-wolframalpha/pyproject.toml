[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-wolframalpha"
version = "0.1.0"
authors = [
    { name = "DoroWolf" },
]
description = "使用 WolframAlpha。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=12.0.0,<13.0.0",
]

[project.entry-points."akaribot.modules"]
wolframalpha = "akaribot.modules.wolframalpha"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
