[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-wolframalpha"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "DoroWolf" },
]
description = "使用 WolframAlpha。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=13.0.0,<13.1.0",
]

[project.entry-points."akaribot.modules"]
wolframalpha = "akaribot.modules.wolframalpha"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
