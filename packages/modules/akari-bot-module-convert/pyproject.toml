[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-convert"
version = "0.1.0"
authors = [
    { name = "Dianliang233" },
]
description = "全能单位转换。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "pint>=0.25.0,<1.0.0",
]

[project.entry-points."akaribot.modules"]
convert = "akaribot.modules.convert"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
