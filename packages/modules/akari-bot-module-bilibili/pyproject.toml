[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-bilibili"
version = "0.1.0"
description = "哔哩哔哩视频相关工具。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "httpx>=0.28.1,<1.0.0",
    "orjson>=3.10.9,<4.0.0",
]

[project.entry-points."akaribot.modules"]
bilibili = "akaribot.modules.bilibili"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
