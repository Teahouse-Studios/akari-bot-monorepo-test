[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-nbnhhsh"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "orjson>=3.10.9,<4.0.0",
]

[project.entry-points."akaribot.modules"]
nbnhhsh = "akaribot.modules.nbnhhsh"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
