[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-phigros"
version = "0.1.0"
authors = [
    { name = "Mivik" },
    { name = "OasisAkari" },
    { name = "DoroWolf" },
]
description = "查询 Phigros 相关内容。"
requires-python = ">=3.12,<4.0"
dependencies = [
    # genb30 曲绘的文字用资源包里的 Noto Sans CJK（T3.3），缺它则曲绘渲染失败。
    "akari-bot-assets-fonts>=0.1.0,<1.0",
    "akari-bot-core>=0.1.0,<1.0",
    "pycryptodome>=3.18.0,<4.0.0",
    "Pillow>=12.0.0,<13.0.0",
    "httpx>=0.28.1,<1.0.0",
    "orjson>=3.10.9,<4.0.0",
    "qrcode>=8.2,<9.0.0",
    "tortoise-orm>=1.1.2,<1.2.0",
]

[project.entry-points."akaribot.modules"]
phigros = "akaribot.modules.phigros"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
