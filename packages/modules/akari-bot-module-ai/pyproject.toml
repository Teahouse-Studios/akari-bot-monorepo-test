[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-ai"
version = "0.1.0"
description = "有事为什么不问问小可呢？"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=12.0.0,<13.0.0",
    "anthropic>=1.5.0",
    "ddgs>=9.14.2",
    "e2b-code-interpreter>=2.6.2",
    "filetype>=1.2.0,<2.0.0",
    "matplotlib>=3.6.3,<4.0.0",
    "openai>=3.6.0,<3.7.0",
    "orjson>=3.10.9,<4.0.0",
    "trafilatura>=2.0.0",
    "pyyaml>=6.0.3",
]

[project.entry-points."akaribot.modules"]
ai = "akaribot.modules.ai"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
