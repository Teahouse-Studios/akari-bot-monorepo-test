[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-ai"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "DoroWolf" },
    { name = "Dianliang233" },
]
description = "有事为什么不问问小可呢？"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "akari-bot-html2text>=0.1.0,<1.0",
    "Pillow>=13.0.0,<13.1.0",
    "anthropic>=1.5.0",
    "ddgs>=9.14.2",
    "e2b-code-interpreter>=2.6.2",
    "filetype>=1.2.0,<2.0.0",
    "google-genai>=2.33.0",
    "matplotlib>=3.6.3,<4.0.0",
    "openai>=3.6.0,<3.7.0",
    "orjson>=3.10.9,<4.0.0",
    "trafilatura>=2.0.0",
    "pyyaml>=6.0.3",
]

[project.entry-points."akaribot.modules"]
ai = "akaribot.modules.ai"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
