[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-color"
version = "0.1.0"
authors = [
    { name = "Dianliang233" },
]
description = "获取颜色信息。"
requires-python = ">=3.12,<4.0"
dependencies = [
    # 取色卡的文字用资源包里的 Noto Sans CJK DemiLight（T3.3），缺它则卡片渲染失败。
    "akari-bot-assets-fonts>=0.1.0,<1.0",
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=12.0.0,<13.0.0",
    "numpy<2.5.3",
    "orjson>=3.10.9,<4.0.0",
    "webcolors>=25.0.0,<26.0.0",
]

[project.entry-points."akaribot.modules"]
color = "akaribot.modules.color"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
