[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-color"
version = "0.1.0"
description = "获取颜色信息。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=12.0.0,<13.0.0",
    "numpy<2.5.3",
    "orjson>=3.10.9,<4.0.0",
    "webcolors>=25.0.0,<26.0.0",
]

[project.entry-points."akaribot.modules"]
color = "akaribot.modules.color"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
