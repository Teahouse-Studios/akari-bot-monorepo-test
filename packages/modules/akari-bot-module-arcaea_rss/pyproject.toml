[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-arcaea_rss"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "SkyEye_FAST" },
]
description = "追踪 Arcaea 版本更新并推送更新消息。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "orjson>=3.10.9,<4.0.0",
]

[project.entry-points."akaribot.modules"]
arcaea_rss = "akaribot.modules.arcaea_rss"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
