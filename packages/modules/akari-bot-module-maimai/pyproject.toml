[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-maimai"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "mai-bot" },
    { name = "OasisAkari" },
    { name = "DoroWolf" },
]
description = "查询 Maimai 相关内容。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    # best30 等成绩图的文字与符号用资源包里的 Noto Sans CJK 与 Symbols2（T3.3），缺它则出图失败。
    "akari-bot-assets-fonts>=0.1.0,<1.0",
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=13.0.0,<13.1.0",
    "langconv==0.4.0",
    "orjson>=3.10.9,<4.0.0",
    "tortoise-orm>=1.1.2,<1.2.0",
]

[project.entry-points."akaribot.modules"]
maimai = "akaribot.modules.maimai"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
