[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-ncmusic"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "bugungu" },
]
description = "网易云音乐相关工具。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
]

[project.entry-points."akaribot.modules"]
ncmusic = "akaribot.modules.ncmusic"

[project.entry-points."akaribot.docs"]
module-ncmusic = "akaribot.modules.ncmusic"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
