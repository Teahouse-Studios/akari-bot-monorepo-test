[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-ncmusic"
version = "0.1.0"
description = "网易云音乐相关工具。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
]

[project.entry-points."akaribot.modules"]
ncmusic = "akaribot.modules.ncmusic"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
