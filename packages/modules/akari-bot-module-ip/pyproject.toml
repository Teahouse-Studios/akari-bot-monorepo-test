[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-ip"
version = "0.1.0"
description = "查询 IP 信息。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
]

[project.entry-points."akaribot.modules"]
ip = "akaribot.modules.ip"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
