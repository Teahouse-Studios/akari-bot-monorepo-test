[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-langconv"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Dianliang233" },
]
description = "简繁转换。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "langconv==0.4.0",
]

[project.entry-points."akaribot.modules"]
langconv = "akaribot.modules.langconv"

[project.entry-points."akaribot.docs"]
module-langconv = "akaribot.modules.langconv"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
