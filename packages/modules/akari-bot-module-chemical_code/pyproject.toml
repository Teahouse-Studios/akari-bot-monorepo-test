[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-chemical_code"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "OasisAkari" },
    { name = "DoroWolf" },
]
description = "化学式回答小游戏。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=13.0.0,<13.1.0",
    "rdkit>=2026.3.1,<2026.4.0",
    "tenacity>=9.0.0,<10.0.0",
]

[project.entry-points."akaribot.modules"]
chemical_code = "akaribot.modules.chemical_code"

[project.entry-points."akaribot.docs"]
module-chemical_code = "akaribot.modules.chemical_code"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
