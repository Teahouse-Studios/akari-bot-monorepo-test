[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-chemical_code"
version = "0.1.0"
authors = [
    { name = "OasisAkari" },
    { name = "DoroWolf" },
]
description = "化学式回答小游戏。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=12.0.0,<13.0.0",
    "rdkit>=2026.3.1,<2026.4.0",
    "tenacity>=9.0.0,<10.0.0",
]

[project.entry-points."akaribot.modules"]
chemical_code = "akaribot.modules.chemical_code"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
