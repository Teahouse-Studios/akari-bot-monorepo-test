[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-hitokoto"
version = "0.1.0"
description = "获取一言。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    # langconv 上游停更，本仓库的修复版 fork 尚未发版，故暂用 git 直链；发布前须改为常规分发。
    "langconv @ git+https://github.com/Teahouse-Studios/langconv.py.git",
]

[project.entry-points."akaribot.modules"]
hitokoto = "akaribot.modules.hitokoto"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]

# langconv 只有 git 直链；hatchling 默认拒绝 direct reference，发布前须替换为常规版本。
[tool.hatch.metadata]
allow-direct-references = true
