[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-wordle"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Dianliang233" },
    { name = "DoroWolf" },
]
description = "玩 Wordle。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    # 棋盘与键盘渲染用资源包里的 Noto Sans CJK Bold（T3.3），缺它则出图失败。
    "akari-bot-assets-fonts>=0.1.0,<1.0",
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=13.0.0,<13.1.0",
    "attrs>=26.1.0",
]

[project.entry-points."akaribot.modules"]
wordle = "akaribot.modules.wordle"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
