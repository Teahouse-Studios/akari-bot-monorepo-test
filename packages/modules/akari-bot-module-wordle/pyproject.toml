[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-wordle"
version = "0.1.0"
description = "玩 Wordle。"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "Pillow>=12.0.0,<13.0.0",
    "attrs>=25.0.0,<26.0.0",
]

[project.entry-points."akaribot.modules"]
wordle = "akaribot.modules.wordle"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]
