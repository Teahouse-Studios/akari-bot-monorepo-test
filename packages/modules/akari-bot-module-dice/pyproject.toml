[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-dice"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Light-Beacon" },
    { name = "DoroWolf" },
]
description = "随机骰子，可指定投骰次数与 DC 判断判定。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "numpy<2.5.3",
    "simpleeval>=1.0.0,<2.0.0",
]

[project.entry-points."akaribot.modules"]
dice = "akaribot.modules.dice"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
