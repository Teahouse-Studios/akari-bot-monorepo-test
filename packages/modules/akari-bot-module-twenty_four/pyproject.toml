[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-twenty_four"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "DoroWolf" },
]
description = "24 点小游戏。"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
    "simpleeval>=1.0.0,<2.0.0",
]

[project.entry-points."akaribot.modules"]
twenty_four = "akaribot.modules.twenty_four"

[project.entry-points."akaribot.docs"]
module-twenty_four = "akaribot.modules.twenty_four"

[tool.hatch.build.targets.wheel]
packages = ["akaribot"]

[project.urls]
Documentation = "https://github.com/Teahouse-Studios/akari-bot/blob/master/README.md"
Source = "https://github.com/Teahouse-Studios/akari-bot"
Issues = "https://github.com/Teahouse-Studios/akari-bot/issues"
