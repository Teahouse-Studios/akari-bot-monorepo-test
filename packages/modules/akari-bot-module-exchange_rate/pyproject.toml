[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akari-bot-module-exchange_rate"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "akari-bot-core>=0.1.0,<1.0",
]

[project.entry-points."akaribot.modules"]
exchange_rate = "akaribot.modules.exchange_rate"

[tool.hatch.build.targets.wheel]
packages = ["src/akaribot"]
